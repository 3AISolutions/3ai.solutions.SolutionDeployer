name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore 3ai.solutions.SolutionDeployer.slnx

      - name: Build
        run: dotnet build 3ai.solutions.SolutionDeployer.slnx -c Release --no-restore

      - name: Test
        run: dotnet test 3ai.solutions.SolutionDeployer.slnx -c Release --no-build --verbosity normal
