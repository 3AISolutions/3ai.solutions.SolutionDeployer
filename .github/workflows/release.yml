name: Release

# Publishes a Velopack release for every pushed tag of the form v1.2.3.
# Each OS runner builds a self-contained app, packs it with vpk, and uploads the
# installer + delta packages to the same GitHub Release. The app's in-app updater
# (Velopack GithubSource) then discovers these assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACK_ID: 3ai.SolutionDeployer
  APP_PROJECT: src/SolutionDeployer.App/SolutionDeployer.App.csproj
  VPK_VERSION: '1.1.1'

jobs:
  release:
    strategy:
      fail-fast: false
      # Serialize the OS legs: each runs `vpk upload --merge`, and concurrent
      # create/convert of the same GitHub release races ("Validation Failed").
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: SolutionDeployer.App.exe
            icon: src/SolutionDeployer.App/Assets/app-icon.ico
          - os: ubuntu-latest
            rid: linux-x64
            exe: SolutionDeployer.App
            icon: src/SolutionDeployer.App/Assets/app-icon.png
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            exe: SolutionDeployer.App
            icon: src/SolutionDeployer.App/Assets/app-icon.png
            # The two linux arches can't share Velopack's default 'linux' channel/feed,
            # so arm64 gets its own. win/osx/linux-x64 keep the default to preserve
            # existing installs' update path.
            channel: linux-arm64
          - os: macos-latest
            rid: osx-arm64
            exe: SolutionDeployer.App
            icon: src/SolutionDeployer.App/Assets/app-icon.icns
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, so release notes can diff against the previous tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            echo "## What's new in ${VERSION}"
            echo ""
            git log --no-merges --pretty=format:'- %s' "$RANGE" | grep -viE '^- Bump version' || true
            echo ""
            [ -n "$PREV" ] && echo "" && echo "_Changes since ${PREV}._"
          } > notes.md
          echo "----- notes.md -----"; cat notes.md

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Pack with Velopack
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          vpk pack \
            --packId "$PACK_ID" \
            --packVersion "$VERSION" \
            --packDir publish \
            --mainExe "${{ matrix.exe }}" \
            --packTitle "3ai Solution Deployer" \
            --icon "${{ matrix.icon }}" \
            --releaseNotes notes.md \
            ${CHANNEL:+--channel "$CHANNEL"}

      - name: Upload release assets
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --tag "${{ github.ref_name }}" \
            --releaseName "3ai Solution Deployer ${{ env.VERSION }}" \
            --merge \
            --publish \
            ${CHANNEL:+--channel "$CHANNEL"}
