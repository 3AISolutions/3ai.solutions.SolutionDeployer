name: Release

# Publishes a Velopack release for every pushed tag of the form v1.2.3.
# Each OS runner builds a self-contained app, packs it with vpk, and uploads the
# installer + delta packages to the same GitHub Release. The app's in-app updater
# (Velopack GithubSource) then discovers these assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACK_ID: 3ai.SolutionDeployer
  APP_PROJECT: src/SolutionDeployer.App/SolutionDeployer.App.csproj
  VPK_VERSION: '1.1.1'

jobs:
  release:
    strategy:
      fail-fast: false
      # Serialize the OS legs: each runs `vpk upload --merge`, and concurrent
      # create/convert of the same GitHub release races ("Validation Failed").
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: SolutionDeployer.App.exe
            icon: src/SolutionDeployer.App/Assets/app-icon.ico
          - os: ubuntu-latest
            rid: linux-x64
            exe: SolutionDeployer.App
            icon: src/SolutionDeployer.App/Assets/app-icon.png
          - os: macos-latest
            rid: osx-arm64
            exe: SolutionDeployer.App
            icon: src/SolutionDeployer.App/Assets/app-icon.icns
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Pack with Velopack
        shell: bash
        run: |
          vpk pack \
            --packId "$PACK_ID" \
            --packVersion "$VERSION" \
            --packDir publish \
            --mainExe "${{ matrix.exe }}" \
            --packTitle "3ai Solution Deployer" \
            --icon "${{ matrix.icon }}"

      - name: Upload release assets
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --tag "${{ github.ref_name }}" \
            --releaseName "3ai Solution Deployer ${{ env.VERSION }}" \
            --merge \
            --publish
